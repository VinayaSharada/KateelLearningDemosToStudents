<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fraud Detection Playground - Finance AI Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🛡️ Fraud Detection Playground</h1>
      <p class="subtitle">Anomaly Detection Demo</p>
    </header>

    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <!-- Controls -->
      <section class="controls-section">
        <div class="control-group">
          <label>Transactions: <span id="txn-count">1000</span></label>
          <input type="range" id="txn-count-input" min="100" max="5000" value="1000">
        </div>
        <div class="control-group">
          <label>Fraud Rate: <span id="fraud-rate">2%</span></label>
          <input type="range" id="fraud-rate-input" min="0.1" max="10" value="2" step="0.1">
        </div>
        <div class="control-group">
          <label>Detection Threshold: <span id="threshold-value">0.5</span></label>
          <input type="range" id="threshold-input" min="0" max="1" value="0.5" step="0.05">
        </div>
        <button id="run-btn" class="primary-btn">Run Detection</button>
      </section>

      <!-- Results -->
      <section class="results-section">
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-value" id="precision">85%</div>
            <div class="metric-label">Precision</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="recall">78%</div>
            <div class="metric-label">Recall</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="f1-score">81%</div>
            <div class="metric-label">F1-Score</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="fraud-found">42</div>
            <div class="metric-label">Frauds Found</div>
          </div>
        </div>
      </section>

      <!-- Visualization -->
      <section class="viz-section">
        <h2>Transaction Scatter Plot</h2>
        <div class="chart-container">
          <canvas id="scatter-chart" width="600" height="400"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
