<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Secure Code Review</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- KateelLearningDemos Attribution Marker - vinallcontact@gmail.com -->
  <div class="container">
    <header>
      <h1>Secure Code Review</h1>
      <p class="subtitle">Static analysis for security vulnerabilities</p>
    </header>
    
    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <section class="input-section">
        <h2>Code Input</h2>
        <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
        <button id="reviewBtn" class="btn-primary">Review for Security Issues</button>
      </section>
      
      <section id="resultsSection" class="results-section hidden">
        <h2>Security Review Results</h2>
        
        <div class="summary">
          <div class="stat-card">
            <div class="stat-value" id="totalIssues">0</div>
            <div class="stat-label">Issues Found</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="criticalCount">0</div>
            <div class="stat-label">Critical</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="highCount">0</div>
            <div class="stat-label">High</div>
          </div>
        </div>
        
        <div id="issuesList" class="issues-list"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
