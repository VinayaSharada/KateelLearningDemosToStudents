<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feature Store Demo - ML Infrastructure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🏪 Feature Store</h1>
      <p class="subtitle">Central Feature Registry</p>
    </header>

    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <!-- Search & Filter -->
      <section class="controls-section">
        <input type="text" id="search-input" placeholder="Search features..." class="search-input">
        <div class="filter-tags">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="customer">Customer</button>
          <button class="filter-btn" data-filter="transaction">Transaction</button>
          <button class="filter-btn" data-filter="risk">Risk</button>
        </div>
      </section>

      <!-- Feature Catalog -->
      <section class="catalog-section">
        <h2>Feature Catalog</h2>
        <div id="feature-list" class="feature-list"></div>
      </section>
    </main>

    <!-- Feature Detail Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close" onclick="app.closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
