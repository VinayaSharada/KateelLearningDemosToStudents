<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bank Failure Prediction</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>🏦 Bank Failure Prediction</h1>
    <p class="subtitle">Predict which banks will fail using financial ratios</p>
    
    <div class="input-section">
      <h2>Financial Ratios</h2>
      <div class="inputs">
        <div class="input-group">
          <label>Illiquidity Ratio</label>
          <input type="range" id="illiqRatio" min="0" max="1" step="0.01" value="0.5">
          <span id="illiqValue">0.50</span>
        </div>
        <div class="input-group">
          <label>Deposit Loss Ratio</label>
          <input type="range" id="depositLoss" min="0" max="1" step="0.01" value="0.3">
          <span id="depositValue">0.30</span>
        </div>
        <div class="input-group">
          <label>Net Charge-Offs Ratio</label>
          <input type="range" id="chargeOffs" min="0" max="1" step="0.01" value="0.05">
          <span id="chargeOffValue">0.05</span>
        </div>
      </div>
      <button onclick="predictFailure()">Predict Failure</button>
    </div>
    
    <div id="result" class="result-section hidden">
      <h2>Prediction Result</h2>
      <div id="prediction"></div>
      <div id="probability"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
