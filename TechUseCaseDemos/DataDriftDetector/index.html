<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Data Drift Detector</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <header>
      <h1>Data Drift Detector</h1>
      <p class="subtitle">Monitor input data distribution changes</p>
    </header>
    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <section class="controls">
        <h2>Simulation Controls</h2>
        <button id="startBtn">Start Drift Simulation</button>
        <button id="resetBtn">Reset</button>
      </section>
      <section class="charts">
        <div class="chart-container">
          <h3>Reference Distribution</h3>
          <canvas id="refChart" height="150"></canvas>
        </div>
        <div class="chart-container">
          <h3>Current Distribution</h3>
          <canvas id="curChart" height="150"></canvas>
        </div>
      </section>
      <section class="alert">
        <div id="alertBox">Drift Score: 0.00</div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
