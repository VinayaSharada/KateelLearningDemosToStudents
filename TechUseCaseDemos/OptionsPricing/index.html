  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Options Pricing Calculator</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>📈 Options Pricing Calculator</h1>
    <p class="subtitle">Black-Scholes European option pricing with Greeks</p>
    
    <div class="content">
      <div class="inputs">
        <h2>Option Parameters</h2>
        <div class="grid">
          <div class="input-group">
            <label>S (Spot Price)</label>
            <input type="number" id="spot" value="100" step="0.01">
          </div>
          <div class="input-group">
            <label>K (Strike Price)</label>
            <input type="number" id="strike" value="100" step="0.01">
          </div>
          <div class="input-group">
            <label>T (Time to Expiry)</label>
            <input type="number" id="time" value="0.25" step="0.01">
          </div>
          <div class="input-group">
            <label>r (Interest Rate)</label>
            <input type="number" id="rate" value="0.05" step="0.001">
          </div>
          <div class="input-group">
            <label>σ (Volatility)</label>
            <input type="number" id="vol" value="0.2" step="0.01">
          </div>
        </div>
        <button onclick="calculate()">Calculate</button>
      </div>
      
      <div class="results">
        <h2>Results</h2>
        <div id="output"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
