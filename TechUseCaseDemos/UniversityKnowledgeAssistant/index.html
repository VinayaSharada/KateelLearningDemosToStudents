    <title>University Knowledge Assistant</title>
    <style>
        /* University Knowledge Assistant - Embeddable Widget */
        * { box-sizing: border-box; }
        
        :root {
            --primary: #1e40af;
            --primary-dark: #1e3a8a;
            --secondary: #fbbf24;
            --text: #e0e0e0;
            --bg: rgba(30, 58, 170, 0.95);
            --border: rgba(255, 255, 255, 0.1);
        }
        
        .uka-widget {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .uka-header {
            padding: 20px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .uka-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .uka-icon {
            font-size: 2rem;
        }
        
        .uka-body {
            padding: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .uka-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .uka-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .uka-btn-primary {
            background: var(--secondary);
            color: #1a1a1a;
        }
        
        .uka-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .uka-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .uka-status {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 10px;
        }
        
        .uka-chat {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .uka-message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            max-width: 85%;
        }
        
        .uka-message.user {
            background: rgba(255, 255, 255, 0.1);
            margin-left: auto;
        }
        
        .uka-message.assistant {
            background: rgba(251, 191, 36, 0.1);
            border-left: 3px solid var(--secondary);
        }
        
        .uka-message-time {
            font-size: 10px;
            color: #666;
            margin-top: 5px;
        }
        
        .uka-input-area {
            display: flex;
            gap: 10px;
        }
        
        .uka-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
        }
        
        .uka-input::placeholder {
            color: #666;
        }
        
        .uka-voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .uka-voice-btn.listening {
            background: #ef4444;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .uka-citations {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .uka-footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #666;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
