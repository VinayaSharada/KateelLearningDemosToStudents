<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPV Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget">
        <header>
            <h1>💰 NPV Calculator</h1>
            <p>Net Present Value & Capital Budgeting</p>
        </header>
        
        <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
            <div class="input-section">
                <label>Cash Flows (one per line)</label>
                <textarea id="cashflows" rows="5">1000
500
300
200</textarea>
                <input type="number" id="discount" placeholder="Discount Rate (%)" value="10">
            </div>
            
            <button id="calculate-btn">Calculate NPV</button>
            
            <div class="results">
                <div class="result-box">
                    <span>NPV</span>
                    <span class="value" id="npv">$102.15</span>
                </div>
                <div class="result-box">
                    <span>IRR</span>
                    <span class="value" id="irr">15.2%</span>
                </div>
                <div class="result-box">
                    <span>PV of Inflows</span>
                    <span class="value" id="pv">$1450.00</span>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Capital Budgeting | Financial Analysis</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
