<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI Data Analyzer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- KateelLearningDemos Attribution Marker - vinallcontact@gmail.com -->
  <div class="container">
    <header>
      <h1>AI Data Analyzer</h1>
      <p class="subtitle">Compare traditional vs AI-powered data analysis</p>
    </header>
    
    <main>
      <section class="controls">
        <div class="toggle-section">
          <label>
            <input type="checkbox" id="aiToggle" /> Enable AI Analysis
          </label>
        </div>
        
        <div id="promptSection" class="prompt-section hidden">
          <div class="field">
            <label for="analysisPrompt">Analysis Focus</label>
            <select id="analysisPrompt">
              <option value="trends">Identify trends and patterns</option>
              <option value="anomalies">Detect anomalies and outliers</option>
              <option value="insights">Generate business insights</option>
              <option value="forecast">Forecast future trends</option>
            </select>
          </div>
        </div>
      </section>
      
      <section class="data-section">
        <div class="field">
          <label for="dataInput">Paste CSV Data</label>
          <textarea id="dataInput" rows="8">date,sales,visitors,conversion
2024-01-01,1200,5000,2.4
2024-01-02,1350,5200,2.6
2024-01-03,1180,4800,2.5
2024-01-04,1420,5500,2.6
2024-01-05,1600,6000,2.7
2024-01-06,980,4200,2.3
2024-01-07,1100,4500,2.4</textarea>
        </div>
        <button id="analyzeBtn" class="btn-primary">Analyze Data</button>
      </section>
      
      <section id="resultSection" class="result-section hidden">
        <div class="results-container">
          <div class="result-card">
            <h3>Traditional Analysis (Basic Stats)</h3>
            <div id="traditionalResult" class="result-content"></div>
          </div>
          <div class="result-card ai-result">
            <h3>AI Analysis (Insights)</h3>
            <div id="aiResult" class="result-content"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
