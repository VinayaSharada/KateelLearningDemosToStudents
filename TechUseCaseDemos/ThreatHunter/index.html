<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI Threat Hunter</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- KateelLearningDemos Attribution Marker - vinallcontact@gmail.com -->
  <div class="container">
    <header>
      <h1>AI Threat Hunter</h1>
      <p class="subtitle">Machine learning-powered anomaly detection for security logs</p>
    </header>
    
    <main>
      <section class="upload-section">
        <h2>Upload Log File</h2>
        <div class="upload-area" id="uploadArea">
          <p>Drag & drop log file or click to browse</p>
          <input type="file" id="fileInput" accept=".log,.csv,.json" style="display: none;"/>
        </div>
        <button id="analyzeBtn" class="btn-primary" disabled>Analyze Logs</button>
      </section>
      
      <section id="resultsSection" class="results-section hidden">
        <h2>Threat Analysis Results</h2>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalLogs">0</div>
            <div class="stat-label">Logs Analyzed</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="anomaliesFound">0</div>
            <div class="stat-label">Anomalies Detected</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="riskScore">0%</div>
            <div class="stat-label">Risk Score</div>
          </div>
        </div>
        
        <h3>Detected Anomalies</h3>
        <div id="anomaliesList" class="anomalies-list"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
