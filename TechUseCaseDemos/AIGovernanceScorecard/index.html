      <h1>AI Governance Scorecard</h1>

    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">

      <section class="checklist-section">
        <h2>Governance Checklist</h2>
        <div id="checklist"></div>
      </section>
      <section class="results-section">
        <h2>Score</h2>
        <div class="score-card">
          <div class="score-value" id="scoreValue">0</div>
          <div class="score-label">Compliance Score</div>
          <div class="score-status" id="scoreStatus">Incomplete</div>
