name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify GitHub Pages site
      run: python scripts/verify_site.py
    - name: Verify analytics coverage
      run: python add_analytics.py --check
