<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mule Account Detection - AML</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1">🕵️ Mule Account Detection</h1>
      <p class="subtitle">Anti-Money Laundering Demo</p>
    </header>

    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <section class="controls">
        <button id="generate-btn" class="primary-btn">Generate Transactions</button>
        <button id="detect-btn" class="secondary-btn">Run Detection</button>
      </section>

      <section class="results">
        <div class="metrics">
          <div class="metric-card">
            <div class="metric-value" id="total-txns">1000</div>
            <div class="metric-label">Total Transactions</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="flagged">12</div>
            <div class="metric-label">Flagged Accounts</div>
          </div>
          <div class="metric-card">
            <div class="metric-value" id="precision">83%</div>
            <div class="metric-label">Detection Rate</div>
          </div>
        </div>
      </section>

      <section class="transactions">
        <h2>Flagged Transactions</h2>
        <div id="txn-list" class="txn-list"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
