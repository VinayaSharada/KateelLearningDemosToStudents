<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V672XGCRSK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-V672XGCRSK');
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Financial Contagion Model</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🔗 Financial Contagion</h1>
      <p class="subtitle">Network Risk Simulation</p>
    </header>

    <main>
  <!-- Learning Guide -->
  <section class="learning-guide" style="background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
    <h3 style="color: #3b82f6; margin-bottom: 0.5rem;">📚 Learning Guide</h3>
    <p style="color: #94a3b8; font-size: 0.875rem;">Interactive finance demonstration - All inputs are editable!</p>
    <p style="color: #64748b; font-size: 0.75rem; margin-top: 0.25rem;">Experiment with different values to see how outputs change.</p>
  </section>
      <section class="controls">
        <div class="control-group">
          <label>Network Size: <span id="size-val">20</span></label>
          <input type="range" id="network-size" min="5" max="50" value="20">
        </div>
        <div class="control-group">
          <label>Connection Probability: <span id="prob-val">30%</span></label>
          <input type="range" id="conn-prob" min="5" max="95" value="30">
        </div>
        <div class="control-group">
          <label>Initial Defaults: <span id="default-val">2</span></label>
          <input type="range" id="init-defaults" min="1" max="10" value="2">
        </div>
        <button id="run-sim" class="primary-btn">Run Simulation</button>
      </section>

      <section class="results">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="total-nodes">20</div>
            <div class="stat-label">Total Nodes</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="defaulted">2</div>
            <div class="stat-label">Defaulted</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="contagion">0%</div>
            <div class="stat-label">Contagion Rate</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="threshold">0.3</div>
            <div class="stat-label">Threshold</div>
          </div>
        </div>
      </section>

      <section class="visualization">
        <h2>Network Graph</h2>
        <canvas id="network-canvas" width="500" height="400"></canvas>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
