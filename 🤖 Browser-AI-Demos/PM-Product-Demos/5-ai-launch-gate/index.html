<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AI Launch Gate · PM Demo 05</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07070e;color:#e2e2f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh;display:flex;flex-direction:column}
a{color:#6366f1;text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:'Courier New',monospace}

/* FILE:// WARN */
#fp-warn{display:none}

/* HEADER */
.top-bar{background:#0a0a16;border-bottom:1px solid #1a1a30;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back-link{color:#6366f1;font-size:12px;font-weight:600;white-space:nowrap}
.top-bar-title{font-size:16px;font-weight:700;color:#e2e2f0;flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge-indigo{background:#312e81;color:#a5b4fc}
.badge-amber{background:#451a03;color:#fcd34d}
.badge-green{background:#052e16;color:#4ade80}
.badge-red{background:#450a0a;color:#fca5a5}
.badge-cyan{background:#083344;color:#67e8f9}
.badge-grey{background:#1e1e2e;color:#94a3b8}

/* SCENARIO SELECTOR */
.scenario-bar{background:#0d0d1a;border-bottom:1px solid #1a1a30;padding:10px 20px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.scenario-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-right:4px;padding-top:6px;white-space:nowrap}
.scenario-cards{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.scenario-card{border:1px solid #1a1a30;background:#0a0a16;color:#94a3b8;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;max-width:180px;text-align:left}
.scenario-card:hover{border-color:#6366f1;color:#a5b4fc;background:#0f0f1e}
.scenario-card.active{background:#1e1b4b;border-color:#6366f1;color:#a5b4fc}
.scenario-card-name{font-weight:700;margin-bottom:2px}
.scenario-card-desc{font-size:10px;font-weight:400;color:#6b7280;line-height:1.4}
.scenario-card.active .scenario-card-desc{color:#818cf8}

/* READINESS DASHBOARD */
.readiness-bar{background:#0d0d1a;border-bottom:1px solid #1a1a30;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.readiness-label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.ev-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid transparent}
.ev-pill-green{background:#052e16;border-color:#16a34a;color:#4ade80}
.ev-pill-amber{background:#1c1003;border-color:#92400e;color:#fbbf24}
.ev-pill-red{background:#1c0606;border-color:#7f1d1d;color:#f87171}
.overall-score{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}

/* MAIN LAYOUT */
.main-body{display:flex;flex:1;overflow:hidden}
.pane-left{flex:1;overflow:auto;border-right:1px solid #1a1a30;display:flex;flex-direction:column}
.pane-right{width:400px;min-width:320px;overflow:auto;display:flex;flex-direction:column}

/* PANEL HEADERS */
.panel-hdr{background:#0a0a16;border-bottom:1px solid #1a1a30;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10}
.panel-hdr-title{font-size:12px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.06em}

/* EVIDENCE TABS */
.ev-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:10px 14px 0;background:#0a0a16;border-bottom:1px solid #1a1a30;position:sticky;top:42px;z-index:9}
.ev-tab{padding:6px 12px;border-radius:6px 6px 0 0;cursor:pointer;font-size:11px;font-weight:600;color:#6b7280;background:#12122a;border:1px solid #1a1a30;border-bottom:none;transition:all .15s;display:flex;align-items:center;gap:5px}
.ev-tab:hover{color:#a5b4fc;background:#1e1b4b}
.ev-tab.active{background:#0d0d1a;color:#e2e2f0;border-color:#1a1a30;border-bottom-color:#0d0d1a;margin-bottom:-1px;padding-bottom:7px}
.ev-tab .tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tl-green{background:#22c55e}
.tl-amber{background:#f59e0b}
.tl-red{background:#ef4444}

/* EVIDENCE BODY */
.ev-body{flex:1;padding:16px 18px;overflow:auto}
.ev-content{display:none}
.ev-content.active{display:block}
.ev-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ev-status-badge{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.ev-status-green{background:#052e16;border:1px solid #16a34a;color:#4ade80}
.ev-status-amber{background:#1c1003;border:1px solid #92400e;color:#fbbf24}
.ev-status-red{background:#1c0606;border:1px solid #7f1d1d;color:#f87171}
.ev-score-circle{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.ev-score-green{background:#052e16;border:3px solid #22c55e;color:#4ade80}
.ev-score-amber{background:#1c1003;border:3px solid #f59e0b;color:#fbbf24}
.ev-score-red{background:#1c0606;border:3px solid #ef4444;color:#f87171}
.ev-detail{font-size:12px;color:#94a3b8;line-height:1.7;background:#0a0a16;border:1px solid #1a1a30;border-radius:8px;padding:12px 14px}
.blocker-badge{display:inline-flex;align-items:center;gap:6px;background:#1c0606;border:1px solid #7f1d1d;color:#f87171;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;margin-top:12px}

/* BLOCKING ISSUES BANNER */
.blocking-banner{margin:12px 16px;background:#1c0606;border:1px solid #7f1d1d;border-radius:8px;padding:12px 14px}
.blocking-banner-title{font-size:12px;font-weight:700;color:#f87171;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.blocking-item{font-size:11px;color:#fca5a5;padding:3px 0;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.blocking-item::before{content:"•";color:#ef4444;flex-shrink:0;margin-top:1px}

/* RIGHT PANEL */
.objections-section{padding:14px}
.objection-card{background:#0d0d1a;border:1px solid #1a1a30;border-radius:8px;padding:12px;margin-bottom:10px}
.objection-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.objection-icon{font-size:16px}
.objection-role{font-size:12px;font-weight:700}
.objection-text{font-size:11px;color:#94a3b8;line-height:1.6}

/* DECISION BUTTONS */
.decision-section{padding:14px;border-top:1px solid #1a1a30}
.decision-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.decision-btn-grid{display:flex;flex-direction:column;gap:8px}
.decision-btn{width:100%;padding:12px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;transition:all .15s;text-align:left}
.decision-btn:disabled{opacity:.5;cursor:not-allowed}
.btn-launch{background:#166534;border:1px solid #22c55e;color:#4ade80}
.btn-launch:hover:not(:disabled){background:#15803d;color:#86efac}
.btn-launch.has-blockers{background:#1e1e2e;border:1px solid #374151;color:#6b7280}
.btn-launch.has-blockers:hover:not(:disabled){background:#262630;color:#94a3b8}
.btn-beta{background:#1e1b4b;border:1px solid #6366f1;color:#a5b4fc}
.btn-beta:hover:not(:disabled){background:#312e81;color:#c7d2fe}
.btn-human{background:#451a03;border:1px solid #f59e0b;color:#fcd34d}
.btn-human:hover:not(:disabled){background:#78350f;color:#fde68a}
.btn-delay{background:#1e1e2e;border:1px solid #475569;color:#94a3b8}
.btn-delay:hover:not(:disabled){background:#293040;color:#cbd5e1}
.decision-btn .btn-icon{font-size:18px;flex-shrink:0}
.decision-btn .btn-label{flex:1}
.decision-btn .btn-sub{font-size:10px;font-weight:400;opacity:.75;margin-top:1px}
.blocker-warning{font-size:10px;color:#f87171;background:#1c0606;border:1px solid #7f1d1d;border-radius:4px;padding:4px 8px;margin-bottom:8px;display:none}
.blocker-warning.show{display:block}

/* OUTCOME PANEL */
.outcome-panel{position:absolute;inset:0;background:#07070e;z-index:20;overflow:auto;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s ease}
.outcome-panel.visible{opacity:1;pointer-events:all}
.outcome-inner{padding:20px;flex:1}
.outcome-score-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.outcome-score-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0;border:4px solid transparent}
.outcome-score-green{background:#052e16;border-color:#22c55e;color:#4ade80}
.outcome-score-amber{background:#1c1003;border-color:#f59e0b;color:#fbbf24}
.outcome-score-red{background:#1c0606;border-color:#ef4444;color:#f87171}
.outcome-score-label{font-size:10px;font-weight:600;opacity:.7;margin-top:2px}
.outcome-headline{font-size:16px;font-weight:700;color:#e2e2f0;line-height:1.4}
.outcome-detail{font-size:12px;color:#94a3b8;line-height:1.7;background:#0d0d1a;border:1px solid #1a1a30;border-radius:8px;padding:14px;margin-bottom:14px}
.outcome-section-title{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:14px}
.outcome-ideal-box{background:#0f0f20;border:1px solid #4338ca;border-radius:8px;padding:12px}
.outcome-ideal-name{font-size:13px;font-weight:700;color:#a5b4fc;margin-bottom:4px}
.outcome-pm-note{font-size:12px;color:#94a3b8;line-height:1.6}
.reset-btn{width:100%;margin-top:16px;padding:11px;border-radius:8px;background:#1e1b4b;border:1px solid #6366f1;color:#a5b4fc;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.reset-btn:hover{background:#312e81;color:#c7d2fe}

/* RIGHT PANE WRAPPER (for outcome overlay) */
.pane-right-inner{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden}

/* PM REFLECTION */
.reflection-section{padding:14px;border-top:1px solid #1a1a30}
.reflection-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.reflection-toggle:hover{color:#a5b4fc}
.reflection-toggle .chevron{transition:transform .2s;font-size:10px}
.reflection-toggle.open .chevron{transform:rotate(180deg)}
.reflection-body{display:none;margin-top:10px}
.reflection-body.open{display:block}
.reflection-item{font-size:11px;color:#94a3b8;line-height:1.6;padding:6px 0;border-bottom:1px solid #12122a;display:flex;gap:8px}
.reflection-item:last-child{border-bottom:none}
.reflection-item .ri-icon{flex-shrink:0;width:18px}

/* BOTTOM BAR */
.bottom-bar{background:#0a0a16;border-top:1px solid #1a1a30;padding:8px 20px;font-size:11px;color:#4b5563;text-align:center}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#07070e}
::-webkit-scrollbar-thumb{background:#1a1a30;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#312e81}
</style>
</head>
