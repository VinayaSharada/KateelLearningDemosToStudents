<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Kateel demo analytics and error telemetry -->
  <script src="../../../assets/analytics.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experimentation & Metrics Simulator | PM Demo 01</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #07070e;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    #header {
      background: #0a0a16;
      border-bottom: 1px solid #1a1a30;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .back-link {
      color: #404070;
      text-decoration: none;
      font-size: 12px;
      flex-shrink: 0;
      transition: color .2s;
    }
    .back-link:hover { color: #8080b0; }
    #header h1 { font-size: 16px; font-weight: 700; flex: 1; }
    .badge {
      font-size: 10.5px; font-weight: 600; padding: 2px 10px; border-radius: 99px;
      flex-shrink: 0;
    }
    .badge-indigo {
      background: rgba(99,102,241,.15);
      border: 1px solid rgba(99,102,241,.35);
      color: #a5b4fc;
    }
    .badge-amber {
      background: rgba(245,158,11,.12);
      border: 1px solid rgba(245,158,11,.3);
      color: #fcd34d;
    }

    /* ── use-case tabs ── */
    #tabs-bar {
      background: #0d0d1a;
      border-bottom: 1px solid #1a1a30;
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tab-btn {
      background: rgba(255,255,255,.04);
      border: 1px solid #1a1a30;
      color: #8080b0;
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .tab-btn:hover { background: rgba(99,102,241,.12); color: #a5b4fc; border-color: rgba(99,102,241,.3); }
    .tab-btn.active {
      background: rgba(99,102,241,.2);
      border-color: rgba(99,102,241,.5);
      color: #c7d2fe;
    }

    /* ── main workspace ── */
    #workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      overflow: hidden;
    }
    @media (max-width: 1024px) {
      #workspace { grid-template-columns: 1fr; }
    }

    /* ── left panel ── */
    #left-panel {
      border-right: 1px solid #1a1a30;
      overflow-y: auto;
      padding: 0;
    }
    .panel-section {
      border-bottom: 1px solid #1a1a30;
      padding: 14px 16px;
    }
    .panel-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #4a4a80;
      margin-bottom: 12px;
    }

    /* preset buttons */
    .preset-row { display: flex; gap: 8px; }
    .preset-btn {
      flex: 1;
      background: rgba(255,255,255,.04);
      border: 1px solid #1a1a30;
      color: #8080b0;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .preset-btn:hover { background: rgba(99,102,241,.12); color: #a5b4fc; border-color: rgba(99,102,241,.3); }
    .preset-btn.active {
      background: rgba(99,102,241,.2);
      border-color: rgba(99,102,241,.5);
      color: #c7d2fe;
    }

    /* sliders */
    .slider-group { margin-bottom: 14px; }
    .slider-group:last-child { margin-bottom: 0; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .slider-label span:first-child { font-size: 12px; color: #b0b0d0; font-weight: 500; }
    .slider-value {
      font-size: 12px;
      font-weight: 700;
      color: #6366f1;
      font-variant-numeric: tabular-nums;
    }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #1a1a30;
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 0 2px #07070e, 0 0 0 4px rgba(99,102,241,.3);
      cursor: pointer;
      transition: box-shadow .15s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 2px #07070e, 0 0 0 6px rgba(99,102,241,.5);
    }
    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #6366f1;
      border: none;
      cursor: pointer;
    }

    /* review policy */
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #b0b0d0;
      cursor: pointer;
    }
    .radio-option input[type=radio] { accent-color: #6366f1; cursor: pointer; }
    .radio-option.active { color: #c7d2fe; }

    #band-sliders {
      margin-top: 10px;
      padding: 10px;
      background: rgba(99,102,241,.06);
      border: 1px solid rgba(99,102,241,.15);
      border-radius: 8px;
      display: none;
    }
    #band-sliders.visible { display: block; }
    #band-sliders .slider-group { margin-bottom: 10px; }
    #band-sliders .slider-group:last-child { margin-bottom: 0; }

    /* snapshot buttons */
    .snapshot-row { display: flex; gap: 8px; }
    .snap-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: all .2s;
    }
    .snap-btn-a {
      background: rgba(99,102,241,.1);
      border-color: rgba(99,102,241,.3);
      color: #a5b4fc;
    }
    .snap-btn-a:hover { background: rgba(99,102,241,.2); }
    .snap-btn-a.saved {
      background: rgba(99,102,241,.25);
      border-color: #6366f1;
      color: #e0e7ff;
    }
    .snap-btn-b {
      background: rgba(34,197,94,.08);
      border-color: rgba(34,197,94,.25);
      color: #86efac;
    }
    .snap-btn-b:hover { background: rgba(34,197,94,.15); }
    .snap-btn-b.saved {
      background: rgba(34,197,94,.2);
      border-color: #22c55e;
      color: #dcfce7;
    }

    /* ── right panel ── */
    #right-panel {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* confusion matrix */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #4a4a80;
      margin-bottom: 10px;
    }
    #confusion-wrapper {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-radius: 10px;
      padding: 14px;
    }
    .cm-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .cm-table th {
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #4a4a80;
      text-align: center;
    }
    .cm-table td {
      padding: 10px;
      text-align: center;
      border: 1px solid #1a1a30;
      border-radius: 4px;
    }
    .cm-label {
      font-size: 11px;
      color: #4a4a80;
      font-weight: 600;
      text-align: right !important;
      background: transparent !important;
      border: none !important;
    }
    .cell-tp { background: rgba(34,197,94,.1); }
    .cell-fp { background: rgba(239,68,68,.1); }
    .cell-fn { background: rgba(245,158,11,.1); }
    .cell-tn { background: rgba(99,102,241,.08); }
    .cell-count {
      font-size: 18px;
      font-weight: 700;
      display: block;
      font-variant-numeric: tabular-nums;
    }
    .cell-tp .cell-count { color: #22c55e; }
    .cell-fp .cell-count { color: #ef4444; }
    .cell-fn .cell-count { color: #f59e0b; }
    .cell-tn .cell-count { color: #818cf8; }
    .cell-pct {
      font-size: 10px;
      color: #6060a0;
      display: block;
      margin-top: 2px;
    }
    .cell-label-sm {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
      opacity: .7;
    }

    /* metric cards */
    .cards-row {
      display: grid;
      gap: 10px;
    }
    .cards-row-4 { grid-template-columns: repeat(4, 1fr); }
    .cards-row-3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 700px) {
      .cards-row-4, .cards-row-3 { grid-template-columns: repeat(2, 1fr); }
    }
    .metric-card {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .metric-card-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #4a4a80;
      margin-bottom: 6px;
    }
    .metric-card-value {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .metric-card-sub {
      font-size: 10px;
      color: #50508a;
      margin-top: 4px;
    }
    .val-green { color: #22c55e; }
    .val-amber { color: #f59e0b; }
    .val-red   { color: #ef4444; }
    .val-blue  { color: #818cf8; }
    .val-indigo { color: #6366f1; }

    /* explanation box */
    #explanation-box {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-left: 3px solid #6366f1;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #c0c0e0;
    }

    /* comparison table */
    #comparison-section {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-radius: 10px;
      padding: 14px;
    }
    .cmp-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .cmp-table th {
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #4a4a80;
      text-align: right;
      border-bottom: 1px solid #1a1a30;
    }
    .cmp-table th:first-child { text-align: left; }
    .cmp-table td {
      padding: 7px 10px;
      text-align: right;
      border-bottom: 1px solid #0f0f1e;
      font-variant-numeric: tabular-nums;
    }
    .cmp-table td:first-child { text-align: left; color: #8080b0; font-size: 11px; }
    .cmp-better { color: #22c55e; font-weight: 700; }
    .cmp-worse  { color: #ef4444; font-weight: 700; }
    .cmp-same   { color: #8080b0; }

    /* PM reflection box */
    #reflection-bar {
      background: #0d0d1a;
      border-top: 1px solid #1a1a30;
      flex-shrink: 0;
    }
    #reflection-toggle {
      width: 100%;
      background: #0a0a16;
      border: none;
      border-bottom: 1px solid #1a1a30;
      color: #6060a0;
      padding: 8px 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color .2s;
    }
    #reflection-toggle:hover { color: #a0a0d0; }
    #reflection-caret { transition: transform .25s; font-size: 10px; }
    #reflection-caret.open { transform: rotate(180deg); }
    #reflection-content {
      display: none;
      padding: 14px 20px;
    }
    #reflection-content.open { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (max-width: 800px) {
      #reflection-content.open { grid-template-columns: 1fr; }
    }
    .reflection-card {
      background: rgba(255,255,255,.03);
      border: 1px solid #1a1a30;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #9090c0;
    }
    .reflection-card strong { color: #c0c0e0; display: block; margin-bottom: 3px; font-size: 12px; }

    /* footer */
    #footer {
      background: #0a0a16;
      border-top: 1px solid #1a1a30;
      padding: 8px 20px;
      font-size: 11px;
      color: #30305a;
      text-align: center;
      flex-shrink: 0;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1a30; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #2a2a44; }
  </style>
