<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricing & Unit Economics Explorer — PM Demo 04</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #07070e;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .top-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      background: #0d0d1a;
      border-bottom: 1px solid #1a1a30;
      flex-wrap: wrap;
    }
    .back-link {
      color: #7878a8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .15s;
    }
    .back-link:hover { color: #a5b4fc; }
    .nav-title {
      font-size: 17px;
      font-weight: 700;
      color: #e2e2f0;
      flex: 1;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      letter-spacing: .04em;
    }
    .badge-indigo { background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.5); color: #a5b4fc; }
    .badge-amber  { background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.4); color: #fcd34d; }

    /* ── Main layout ── */
    .page-wrap {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Section title ── */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #4a4a7a;
      margin-bottom: 10px;
    }

    /* ── Cards ── */
    .card {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      background: #0a0a16;
      padding: 12px 18px;
      border-bottom: 1px solid #1a1a30;
      font-size: 13px;
      font-weight: 700;
      color: #9090c0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-body { padding: 18px; }

    /* ── Product type selector ── */
    .product-type-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .product-card {
      background: #0d0d1a;
      border: 2px solid #1a1a30;
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      user-select: none;
    }
    .product-card:hover { border-color: #6366f1; background: rgba(99,102,241,.06); }
    .product-card.active { border-color: #6366f1; background: rgba(99,102,241,.10); }
    .product-card .pc-icon { font-size: 26px; margin-bottom: 6px; }
    .product-card .pc-name { font-size: 13px; font-weight: 700; color: #e2e2f0; margin-bottom: 4px; }
    .product-card .pc-desc { font-size: 11px; color: #5a5a8a; line-height: 1.4; }

    /* ── Pricing model radio ── */
    .pricing-model-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pm-radio {
      display: none;
    }
    .pm-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #1a1a30;
      font-size: 12px;
      font-weight: 600;
      color: #7878a8;
      cursor: pointer;
      transition: all .15s;
    }
    .pm-radio:checked + .pm-label {
      background: rgba(99,102,241,.15);
      border-color: #6366f1;
      color: #a5b4fc;
    }
    .pm-label:hover { border-color: #6366f1; color: #a5b4fc; }

    /* ── Two-column main layout ── */
    .main-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .main-cols { grid-template-columns: 1fr; }
    }

    /* ── Slider inputs ── */
    .slider-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 700px) {
      .slider-cols { grid-template-columns: 1fr; }
    }
    .slider-group { display: flex; flex-direction: column; gap: 6px; }
    .slider-label {
      font-size: 12px;
      font-weight: 600;
      color: #9090c0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slider-val {
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 700;
      background: rgba(99,102,241,.12);
      padding: 2px 8px;
      border-radius: 5px;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #1a1a35;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #6366f1;
      cursor: pointer;
      border: 2px solid #a5b4fc;
      transition: background .1s;
    }
    input[type=range]:hover::-webkit-slider-thumb { background: #818cf8; }

    /* ── KPI cards ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: #0a0a16;
      border: 1px solid #1a1a30;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kpi-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #4a4a7a; }
    .kpi-value { font-size: 22px; font-weight: 800; color: #e2e2f0; line-height: 1.1; }
    .kpi-value.green { color: #22c55e; }
    .kpi-value.red   { color: #ef4444; }
    .kpi-value.amber { color: #f59e0b; }
    .kpi-sub  { font-size: 11px; color: #4a4a7a; }

    /* ── Margin gauge ── */
    .gauge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .gauge-svg { overflow: visible; }
    .gauge-val-text { font-size: 18px; font-weight: 800; }

    /* ── COGS bar ── */
    .cogs-bar-wrap { margin-bottom: 16px; }
    .cogs-bar {
      display: flex;
      height: 22px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .cogs-bar-seg { transition: width .3s; min-width: 0; }
    .cogs-bar-labels { display: flex; gap: 14px; flex-wrap: wrap; }
    .cogs-bar-label { font-size: 11px; display: flex; align-items: center; gap: 5px; }
    .cogs-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    /* ── Breakeven ── */
    .breakeven-box {
      background: rgba(99,102,241,.07);
      border: 1px solid rgba(99,102,241,.2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      color: #9090c0;
      margin-top: 4px;
    }
    .breakeven-box strong { color: #a5b4fc; font-size: 15px; }

    /* ── Cohort table ── */
    .cohort-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .cohort-table th {
      text-align: left;
      padding: 7px 10px;
      color: #4a4a7a;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      border-bottom: 1px solid #1a1a30;
    }
    .cohort-table td {
      padding: 9px 10px;
      border-bottom: 1px solid #12122a;
      vertical-align: middle;
    }
    .cohort-table tr:last-child td { border-bottom: none; }
    .cohort-name { font-weight: 700; color: #e2e2f0; }
    .cohort-desc { color: #4a4a7a; font-size: 11px; }
    .margin-good  { color: #22c55e; font-weight: 700; }
    .margin-warn  { color: #f59e0b; font-weight: 700; }
    .margin-bad   { color: #ef4444; font-weight: 700; }

    /* ── Warning banners ── */
    .warn-banner {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      margin-top: 10px;
    }
    .warn-banner.show { display: block; }
    .warn-red {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      color: #fca5a5;
    }
    .warn-amber {
      background: rgba(245,158,11,.10);
      border: 1px solid rgba(245,158,11,.35);
      color: #fcd34d;
    }

    /* ── Sensitivity table ── */
    .sensitivity-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }
    .sensitivity-table td {
      padding: 7px 10px;
      border-bottom: 1px solid #12122a;
    }
    .sensitivity-table tr:last-child td { border-bottom: none; }
    .sensitivity-table .scenario-name { color: #9090c0; }
    .delta-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .delta-green { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.3); }
    .delta-red   { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3); }
    .delta-amber { background: rgba(245,158,11,.12); color: #fcd34d; border: 1px solid rgba(245,158,11,.3); }

    /* ── Risk flags ── */
    .risk-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .risk-item {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 7px;
      display: none;
    }
    .risk-item.show { display: block; }
    .risk-red    { background: rgba(239,68,68,.10); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
    .risk-amber  { background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.25); color: #fcd34d; }
    .risk-blue   { background: rgba(99,102,241,.10); border: 1px solid rgba(99,102,241,.25); color: #a5b4fc; }
    .risk-none   {
      background: rgba(34,197,94,.07);
      border: 1px solid rgba(34,197,94,.2);
      color: #86efac;
      display: block !important;
    }

    /* ── Scenario compare ── */
    .scenario-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .snap-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #1a1a30;
      background: #0a0a16;
      color: #7878a8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .snap-btn:hover { border-color: #6366f1; color: #a5b4fc; }
    .snap-btn.saved { border-color: #22c55e; color: #4ade80; background: rgba(34,197,94,.07); }
    .snap-btn.clear { border-color: #ef4444; color: #f87171; }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      display: none;
    }
    .compare-table.show { display: table; }
    .compare-table th {
      padding: 7px 10px;
      color: #4a4a7a;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      border-bottom: 1px solid #1a1a30;
      text-align: left;
    }
    .compare-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #12122a;
      color: #9090c0;
    }
    .compare-table tr:last-child td { border-bottom: none; }
    .compare-metric { color: #e2e2f0; font-weight: 600; }
    .cmp-better { color: #22c55e; font-weight: 700; }
    .cmp-worse  { color: #ef4444; font-weight: 700; }
    .cmp-same   { color: #7878a8; }
    .no-compare {
      color: #3a3a60;
      font-size: 12px;
      font-style: italic;
      padding: 12px 0;
    }

    /* ── PM Reflection ── */
    .reflection-toggle {
      background: none;
      border: none;
      color: #9090c0;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .reflection-toggle:hover { color: #e2e2f0; }
    .reflection-arrow { transition: transform .2s; display: inline-block; }
    .reflection-arrow.open { transform: rotate(90deg); }
    .reflection-body {
      display: none;
      padding: 16px 18px;
      border-top: 1px solid #1a1a30;
      display: none;
    }
    .reflection-body.open { display: block; }
    .reflection-item {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #12122a;
      font-size: 13px;
      line-height: 1.55;
      color: #9090c0;
    }
    .reflection-item:last-child { border-bottom: none; }
    .reflection-icon { flex-shrink: 0; font-size: 16px; }

    /* ── Footer ── */
    footer {
      background: #0a0a16;
      border-top: 1px solid #1a1a30;
      padding: 14px 28px;
      font-size: 11px;
      color: #3a3a60;
      text-align: center;
    }

    /* ── Util ── */
    .divider { border: none; border-top: 1px solid #1a1a30; margin: 14px 0; }
  </style>
