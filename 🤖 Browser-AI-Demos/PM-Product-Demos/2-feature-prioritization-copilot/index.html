<!DOCTYPE html>
<html lang="en">
<head>

<title>Feature Prioritization Copilot · PM Demo 02</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07070e;color:#e2e2f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;min-height:100vh;display:flex;flex-direction:column}
a{color:#6366f1;text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:'Courier New',monospace}

/* HEADER */
.top-bar{background:#0a0a16;border-bottom:1px solid #1a1a30;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back-link{color:#6366f1;font-size:12px;font-weight:600;white-space:nowrap}
.top-bar-title{font-size:16px;font-weight:700;color:#e2e2f0;flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.badge-indigo{background:#312e81;color:#a5b4fc}
.badge-amber{background:#451a03;color:#fcd34d}
.badge-green{background:#052e16;color:#4ade80}
.badge-red{background:#450a0a;color:#fca5a5}
.badge-blue{background:#0c1a45;color:#7dd3fc}
.badge-purple{background:#2e1065;color:#d8b4fe}
.badge-grey{background:#1e1e2e;color:#94a3b8}
.badge-override{background:#7c2d12;color:#fdba74;font-size:10px}

/* SCENARIO BAR */
.scenario-bar{background:#0d0d1a;border-bottom:1px solid #1a1a30;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scenario-label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.pill{border:1px solid #1a1a30;background:#0a0a16;color:#94a3b8;padding:5px 14px;border-radius:99px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.pill:hover{border-color:#6366f1;color:#a5b4fc}
.pill.active{background:#312e81;border-color:#6366f1;color:#a5b4fc}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden;gap:0}
.pane-left{flex:1;overflow:auto;border-right:1px solid #1a1a30;display:flex;flex-direction:column}
.pane-right{width:380px;min-width:300px;overflow:auto;display:flex;flex-direction:column}

/* PANEL HEADERS */
.panel-hdr{background:#0a0a16;border-bottom:1px solid #1a1a30;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:10}
.panel-hdr-title{font-size:12px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.06em}

/* FEATURE TABLE */
.feature-table-wrap{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse}
thead th{background:#0a0a16;color:#6b7280;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid #1a1a30;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
thead th:hover{color:#a5b4fc}
thead th.sort-asc::after{content:' ↑'}
thead th.sort-desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid #12122a;transition:background .1s}
tbody tr:hover{background:#0d0d1a}
tbody tr.highlight-row{background:#1e1b4b !important;transition:background 0s}
td{padding:6px 8px;vertical-align:middle}
td.td-name{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#e2e2f0}
td.td-num{text-align:center;color:#c4b5fd;font-variant-numeric:tabular-nums}
td.td-edit{text-align:center}

/* INLINE EDIT */
.inline-num{width:46px;background:#12122a;border:1px solid #312e81;color:#a5b4fc;border-radius:4px;text-align:center;padding:2px 4px;font-size:12px}
.inline-num:focus{outline:none;border-color:#6366f1}
.icon-btn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:13px;transition:background .1s;color:#6b7280}
.icon-btn:hover{background:#1a1a30;color:#e2e2f0}
.add-btn{background:#312e81;border:1px solid #6366f1;color:#a5b4fc;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.add-btn:hover{background:#4338ca;color:#fff}
.risk-select,select.inline-select{background:#12122a;border:1px solid #1a1a30;color:#e2e2f0;border-radius:4px;padding:2px 4px;font-size:11px}

/* RANKING LIST */
.rank-list{flex:1;overflow:auto;padding:10px}
.rank-card{background:#0d0d1a;border:1px solid #1a1a30;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;position:relative}
.rank-card:hover{border-color:#6366f1;background:#0f0f20}
.rank-card.active-card{border-color:#6366f1;background:#0f0f20}
.rank-card.top3{border-left:3px solid #6366f1}
.rank-card.bottom2{border-left:3px solid #374151;opacity:.85}
.rank-card-row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rank-num{width:24px;height:24px;background:#1e1b4b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#a5b4fc;flex-shrink:0}
.rank-name{font-size:12px;font-weight:700;color:#e2e2f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-scores{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;padding-left:32px}
.score-chip{font-size:10px;color:#94a3b8;background:#12122a;padding:1px 6px;border-radius:4px}
.rank-badges{display:flex;gap:4px;flex-wrap:wrap;padding-left:32px;margin-top:4px}
.rank-move-btns{display:flex;gap:2px;position:absolute;right:8px;top:8px}
.move-btn{background:#1a1a30;border:none;color:#94a3b8;width:20px;height:20px;border-radius:3px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0}
.move-btn:hover{background:#312e81;color:#a5b4fc}

/* TRADE-OFF PANEL */
.tradeoff-panel{border-top:1px solid #1a1a30;padding:14px;background:#080812}
.tradeoff-title{font-size:11px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.tradeoff-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:12px}
.tradeoff-label{color:#6b7280;min-width:90px;font-weight:600;flex-shrink:0}
.tradeoff-val{color:#e2e2f0;line-height:1.5}
.tradeoff-empty{color:#4b5563;font-size:12px;font-style:italic}

/* OVERRIDE PANEL */
.override-panel{border-top:1px solid #1a1a30;padding:14px;background:#080812}
.override-title{font-size:11px;font-weight:700;color:#a5b4fc;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.override-row{background:#0d0d1a;border:1px solid #1a1a30;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px}
.override-ranks{display:flex;gap:10px;margin-bottom:4px;color:#94a3b8}
.override-ranks span{font-weight:700;color:#fcd34d}
.override-justify{width:100%;background:#07070e;border:1px solid #1a1a30;border-radius:4px;color:#e2e2f0;padding:4px 8px;font-size:11px;resize:vertical;margin-top:4px}
.override-justify:focus{outline:none;border-color:#6366f1}

/* EXPORT */
.export-section{border-top:1px solid #1a1a30;padding:14px}
.export-btn{background:#064e3b;border:1px solid #22c55e;color:#4ade80;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;width:100%;margin-bottom:8px;transition:all .15s}
.export-btn:hover{background:#065f46;color:#86efac}
.export-ta{width:100%;background:#07070e;border:1px solid #1a1a30;border-radius:6px;color:#a5b4fc;padding:10px;font-family:'Courier New',monospace;font-size:11px;resize:vertical;min-height:120px;display:none}

/* REFLECTION BOX */
.reflection-section{border-top:1px solid #1a1a30}
.reflection-toggle{width:100%;background:#0a0a16;border:none;border-bottom:1px solid #1a1a30;color:#94a3b8;padding:10px 14px;text-align:left;cursor:pointer;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.reflection-toggle:hover{color:#e2e2f0}
.reflection-body{background:#07070e;padding:14px 16px;display:none}
.reflection-body.open{display:block}
.reflection-item{margin-bottom:10px;font-size:12px;line-height:1.6;color:#9ca3af}
.reflection-item strong{color:#e2e2f0}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:#0007;z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#0d0d1a;border:1px solid #1a1a30;border-radius:12px;padding:20px;width:440px;max-width:96vw}
.modal-title{font-size:14px;font-weight:700;color:#e2e2f0;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form-full{grid-column:1/-1}
.form-group label{display:block;font-size:11px;font-weight:600;color:#6b7280;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.form-group input,.form-group select{width:100%;background:#07070e;border:1px solid #1a1a30;border-radius:5px;color:#e2e2f0;padding:6px 8px;font-size:12px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#6366f1}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-cancel{background:#1a1a30;border:none;color:#94a3b8;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.modal-save{background:#312e81;border:1px solid #6366f1;color:#a5b4fc;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.modal-cancel:hover{background:#252535}
.modal-save:hover{background:#4338ca;color:#fff}

/* FOOTER */
.footer{background:#0a0a16;border-top:1px solid #1a1a30;padding:8px 20px;text-align:center;color:#374151;font-size:11px;flex-shrink:0}
</style>
