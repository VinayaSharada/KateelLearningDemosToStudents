<title>Build vs Buy vs API Decision Workbench — PM Demo 03</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #07070e;
    --card:     #0d0d1a;
    --panel-hd: #0a0a16;
    --border:   #1a1a30;
    --text:     #e2e2f0;
    --muted:    #8888aa;
    --indigo:   #6366f1;
    --amber:    #f59e0b;
    --green:    #22c55e;
    --red:      #ef4444;
    --cyan:     #06b6d4;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: var(--panel-hd);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .back-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: color .15s;
  }
  .back-link:hover { color: var(--text); }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    flex: 1;
    white-space: nowrap;
  }
  .badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .03em;
  }
  .badge-indigo { background: #6366f122; color: var(--indigo); border: 1px solid #6366f144; }
  .badge-amber  { background: #f59e0b22; color: var(--amber);  border: 1px solid #f59e0b44; }

  /* ── Main wrapper ── */
  .main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── Section titles ── */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    background: var(--panel-hd);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    font-weight: 600;
    font-size: 13px;
  }
  .card-body { padding: 18px; }

  /* ── Capability pills ── */
  .cap-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .cap-pill {
    background: #12121f;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
    user-select: none;
  }
  .cap-pill:hover   { border-color: var(--indigo); color: var(--indigo); }
  .cap-pill.active  { background: #6366f122; border-color: var(--indigo); color: var(--indigo); font-weight: 600; }

  .free-text-wrap { margin-top: 4px; }
  .free-text-wrap label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .free-text-wrap textarea {
    width: 100%;
    background: #12121f;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 8px 12px;
    resize: vertical;
    min-height: 56px;
    font-family: inherit;
  }
  .free-text-wrap textarea:focus { outline: none; border-color: #6366f166; }

  /* ── Slider grid ── */
  .slider-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 28px;
  }
  @media (max-width: 640px) { .slider-grid { grid-template-columns: 1fr; } }

  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 5px;
  }
  .slider-row label span { color: var(--muted); font-size: 11px; font-weight: 400; }
  .slider-row .slider-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    background: #1a1a30;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--indigo);
    cursor: pointer;
    transition: transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  .val-badge {
    display: inline-block;
    min-width: 24px;
    text-align: center;
    background: #6366f122;
    color: var(--indigo);
    border-radius: 4px;
    font-weight: 700;
    font-size: 12px;
    padding: 1px 5px;
  }

  /* ── Option cards ── */
  .option-cards {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  @media (max-width: 900px) { .option-cards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 540px) { .option-cards { grid-template-columns: 1fr; } }

  .option-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .2s;
    position: relative;
  }
  .option-card.winner {
    border-color: var(--indigo);
    box-shadow: 0 0 0 1px #6366f133, 0 4px 24px #6366f11a;
  }
  .option-card .opt-icon { font-size: 26px; }
  .option-card .opt-name {
    font-size: 15px;
    font-weight: 700;
  }
  .opt-rec-badge {
    display: none;
    background: #6366f122;
    color: var(--indigo);
    border: 1px solid #6366f133;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    letter-spacing: .04em;
    width: fit-content;
  }
  .option-card.winner .opt-rec-badge { display: block; }

  .score-wrap { display: flex; align-items: center; gap: 10px; }
  .score-bar-bg {
    flex: 1;
    height: 7px;
    background: #1a1a30;
    border-radius: 4px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: #3a3a55;
    transition: width .35s ease;
  }
  .option-card.winner .score-bar-fill { background: var(--indigo); }
  .score-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--muted);
    min-width: 36px;
    text-align: right;
    transition: color .2s;
  }
  .option-card.winner .score-num { color: var(--indigo); }

  .best-when {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .best-when span::before { content: '• '; color: #4444aa; }

  .flag-list { display: flex; flex-direction: column; gap: 6px; }
  .flag-item {
    background: #2d1515;
    border: 1px solid #ef444444;
    border-radius: 6px;
    color: #fca5a5;
    font-size: 11px;
    padding: 6px 10px;
  }

  /* ── Two-col layout ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }

  /* ── Quadrant map ── */
  #quadrant-wrap {
    position: relative;
    width: 100%;
    padding-top: 100%;
    user-select: none;
  }
  #quadrant-inner {
    position: absolute;
    inset: 0;
  }
  #quadrant-svg { width: 100%; height: 100%; }

  /* ── Recommendation memo ── */
  .memo-box {
    background: #0a0a16;
    border: 1px solid var(--border);
    border-left: 3px solid var(--indigo);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    color: #c8c8e8;
    min-height: 180px;
  }

  /* ── Risk register ── */
  .risk-table-wrap { overflow-x: auto; }
  table.risk-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.risk-table th {
    background: var(--panel-hd);
    padding: 9px 14px;
    text-align: left;
    font-weight: 600;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  table.risk-table td {
    padding: 9px 14px;
    border: 1px solid var(--border);
    text-align: center;
  }
  table.risk-table tr:nth-child(even) td { background: #0a0a16; }
  table.risk-table td:first-child { text-align: left; font-weight: 500; }

  /* ── Export button ── */
  .export-btn {
    background: #6366f122;
    color: var(--indigo);
    border: 1px solid #6366f144;
    border-radius: 7px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .export-btn:hover { background: #6366f133; border-color: var(--indigo); }
  .export-btn:active { transform: scale(.97); }
  .copy-msg {
    font-size: 12px;
    color: var(--green);
    margin-left: 10px;
    opacity: 0;
    transition: opacity .3s;
  }
  .copy-msg.show { opacity: 1; }

  /* ── PM Reflection ── */
  details.reflection {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  details.reflection summary {
    background: var(--panel-hd);
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.reflection summary::-webkit-details-marker { display: none; }
  details.reflection summary::after {
    content: '▸';
    margin-left: auto;
    transition: transform .2s;
    color: var(--muted);
  }
  details.reflection[open] summary::after { transform: rotate(90deg); }
  .reflection-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 18px;
  }
  @media (max-width: 640px) { .reflection-grid { grid-template-columns: 1fr; } }
  .reflection-item {
    background: #0a0a16;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
  }
  .reflection-item strong { color: var(--text); display: block; margin-bottom: 4px; }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    padding: 18px;
    font-size: 12px;
    color: #44445a;
    border-top: 1px solid var(--border);
    margin-top: 32px;
  }

  /* ── Pulse ring ── */
  @keyframes pulse-ring {
    0%   { r: 9; opacity: .7; }
    70%  { r: 16; opacity: 0; }
    100% { r: 9; opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 1.8s ease-out infinite; }

  /* spacing helpers */
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
