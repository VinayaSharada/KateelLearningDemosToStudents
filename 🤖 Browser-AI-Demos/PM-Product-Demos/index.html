<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Product Demos | KateelLearningDemosToStudents</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #07070e;
      color: #e2e2f0;
      min-height: 100vh;
    }

    /* ── file:// warning ── */
    #fp-warn {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: #7c1c1c; color: #fecaca;
      padding: 12px 20px; font-size: 13px; font-weight: 600;
      align-items: center; gap: 12px; box-shadow: 0 2px 12px #0008;
    }
    #fp-warn code { background: #0003; padding: 1px 5px; border-radius: 4px; }
    #fp-warn button {
      background: none; border: 1px solid #fecaca88; color: #fecaca;
      padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }

    /* ── header ── */
    #header {
      background: #090915;
      border-bottom: 1px solid #131325;
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #header-left { display: flex; align-items: center; gap: 14px; }
    #header h1 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .badge {
      font-size: 10.5px; font-weight: 600; padding: 2px 9px;
      border-radius: 99px; white-space: nowrap;
    }
    .badge-indigo { background: rgba(99,102,241,.15); border: 1px solid rgba(99,102,241,.35); color: #a5b4fc; }
    .badge-amber  { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); color: #fcd34d; }
    .back-link { color: #30305a; text-decoration: none; font-size: 13px; }
    .back-link:hover { color: #7070a0; }

    /* ── hero ── */
    #hero {
      background: linear-gradient(135deg, #0a0a1a 0%, #0d0d1f 50%, #080814 100%);
      border-bottom: 1px solid #131325;
      padding: 40px 28px 36px;
      text-align: center;
    }
    #hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
    #hero h2 span { background: linear-gradient(90deg,#6366f1,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #hero p { color: #5a5a90; max-width: 680px; margin: 0 auto 18px; font-size: 14.5px; line-height: 1.65; }
    .session-tags { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    .session-tag {
      font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
      background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.25); color: #818cf8;
    }

    /* ── grid ── */
    #demos {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 28px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ── demo card ── */
    .demo-card {
      background: #0d0d1a;
      border: 1px solid #1a1a30;
      border-radius: 12px;
      padding: 22px 22px 18px;
      text-decoration: none;
      color: inherit;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color .2s, transform .2s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .demo-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent);
      opacity: 0; transition: opacity .2s;
    }
    .demo-card:hover { border-color: #2a2a50; transform: translateY(-2px); box-shadow: 0 8px 32px #00000060; }
    .demo-card:hover::before { opacity: 1; }

    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .card-icon { font-size: 28px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .card-meta { flex: 1; }
    .card-num { font-size: 10px; font-weight: 700; color: #30304a; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
    .card-title { font-size: 15px; font-weight: 700; line-height: 1.3; color: #c8c8e8; }

    .card-desc { font-size: 12.5px; color: #505080; line-height: 1.6; }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .card-tag {
      font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px;
      background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.18); color: #6366f1;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 10px; border-top: 1px solid #1a1a30;
      font-size: 11px; color: #30304a;
    }
    .card-sessions { font-weight: 600; }
    .card-arrow { font-size: 16px; color: #2a2a44; transition: color .2s, transform .2s; }
    .demo-card:hover .card-arrow { color: #6366f1; transform: translateX(4px); }

    .no-model-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25); color: #4ade80;
    }

    /* ── design rules strip ── */
    #rules {
      background: #090912;
      border-top: 1px solid #131325;
      padding: 28px 28px;
    }
    #rules-inner {
      max-width: 960px;
      margin: 0 auto;
    }
    #rules h3 { font-size: 13px; font-weight: 700; color: #4040a0; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }
    .rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .rule-card {
      background: #0d0d1a; border: 1px solid #1a1a30; border-radius: 8px;
      padding: 12px 14px;
    }
    .rule-q { font-size: 11px; font-weight: 700; color: #5050a0; margin-bottom: 4px; }
    .rule-hint { font-size: 11.5px; color: #404060; line-height: 1.5; }

    /* ── footer ── */
    #footer {
      text-align: center; padding: 18px 28px;
      font-size: 11.5px; color: #202040;
      border-top: 1px solid #0f0f1e;
    }
    #footer a { color: #30305a; text-decoration: none; }
    #footer a:hover { color: #6060a0; }
  </style>
