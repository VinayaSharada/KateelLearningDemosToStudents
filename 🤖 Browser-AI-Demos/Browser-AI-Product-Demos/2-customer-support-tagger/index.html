<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Ticket Tagger | Browser AI Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #09090f;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── status bar ── */
    #status-bar {
      background: #0e0e1c;
      border-bottom: 1px solid #1c1c30;
      padding: 7px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      flex-shrink: 0;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #505090; flex-shrink: 0;
      transition: background .4s, box-shadow .4s;
    }
    .dot.loading { background: #f59e0b; animation: pulse 1.2s ease-in-out infinite; }
    .dot.ready   { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .dot.error   { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    #status-label { color: #8080b0; flex: 1; }
    .model-tag {
      font-size: 11px; color: #404068;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      padding: 2px 8px; border-radius: 6px;
    }
    #prog-wrap { width: 130px; height: 3px; background: #1c1c30; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
    #prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#f59e0b,#f97316); border-radius: 99px; transition: width .25s; }
    #prog-pct  { color: #f59e0b; font-size: 11.5px; min-width: 34px; text-align: right; }
    .back-link { color: #30305a; text-decoration: none; font-size: 12px; flex-shrink: 0; }
    .back-link:hover { color: #7070a0; }

    /* ── header ── */
    #header {
      background: #0c0c1a;
      border-bottom: 1px solid #181830;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 700; }
    .badge {
      font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
      background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); color: #fcd34d;
    }

    /* ── two-column layout ── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 720px) {
      #main { grid-template-columns: 1fr; }
    }

    /* ── left panel ── */
    #left-panel {
      border-right: 1px solid #181830;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #left-panel label {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: #50508a;
    }
    #ticket-input {
      flex: 1;
      min-height: 280px;
      background: #111122;
      border: 1px solid #22223a;
      border-radius: 12px;
      padding: 16px;
      color: #e2e2f0;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
    }
    #ticket-input:focus { border-color: #f59e0b; }
    #ticket-input::placeholder { color: #303055; }
    #ticket-input:disabled { opacity: .5; cursor: not-allowed; }

    .sample-btns {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .sample-btn {
      font-size: 11.5px;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid #22223a;
      background: #111122;
      color: #7070a0;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .sample-btn:hover { border-color: #f59e0b; color: #fcd34d; }

    #char-count { font-size: 11px; color: #303055; text-align: right; }

    /* ── right panel ── */
    #right-panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #right-panel > .section-title {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: #50508a;
    }

    /* loading skeleton */
    #loading-overlay {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; flex: 1; color: #40406a; text-align: center;
    }
    #loading-overlay .spinner {
      width: 36px; height: 36px; border: 3px solid #1e1e38;
      border-top-color: #f59e0b; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* result cards */
    #results { display: flex; flex-direction: column; gap: 16px; }

    .result-card {
      background: #0f0f1e;
      border: 1px solid #1e1e38;
      border-radius: 14px;
      padding: 16px 18px;
      transition: border-color .3s;
    }
    .result-card.active { border-color: var(--c); }

    .rc-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #40406a; margin-bottom: 10px;
    }

    /* Sentiment gauge */
    .sentiment-value {
      font-size: 22px; font-weight: 800;
      display: flex; align-items: center; gap: 10px;
    }
    .sentiment-bar-wrap {
      margin-top: 10px; height: 5px;
      background: #1e1e38; border-radius: 99px; overflow: hidden;
    }
    .sentiment-bar { height: 100%; border-radius: 99px; transition: width .5s, background .5s; }
    .sentiment-meta { font-size: 11px; color: #40406a; margin-top: 6px; }

    /* Urgency pills */
    .urgency-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .urgency-pill {
      padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 700;
      border: 2px solid transparent; transition: all .3s; opacity: .3;
    }
    .urgency-pill.active { opacity: 1; }
    .urgency-pill.high   { border-color: #ef4444; color: #fca5a5; background: rgba(239,68,68,.1); }
    .urgency-pill.medium { border-color: #f59e0b; color: #fcd34d; background: rgba(245,158,11,.1); }
    .urgency-pill.low    { border-color: #22c55e; color: #86efac; background: rgba(34,197,94,.1); }

    /* Department routing */
    .dept-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .dept-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; opacity: .35; transition: opacity .3s;
    }
    .dept-row.active { opacity: 1; }
    .dept-icon {
      width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; background: #111122; border: 1px solid #1e1e38;
    }
    .dept-label { flex: 1; font-weight: 600; }
    .dept-score {
      font-size: 11px; color: #50508a;
      font-variant-numeric: tabular-nums;
    }
    .dept-bar-wrap { width: 80px; height: 3px; background: #1e1e38; border-radius: 99px; overflow: hidden; }
    .dept-bar { height: 100%; border-radius: 99px; background: #6366f1; transition: width .5s; }

    /* idle placeholder */
    .idle-placeholder {
      color: #28284a; font-size: 13px; font-style: italic;
    }

    /* processing indicator */
    #processing {
      display: none;
      align-items: center; gap: 8px;
      font-size: 12px; color: #50508a;
      padding: 8px 0;
    }
    #processing.visible { display: flex; }
    .proc-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #f59e0b;
      animation: proc 1s ease-in-out infinite;
    }
    .proc-dot:nth-child(2) { animation-delay: .15s; }
    .proc-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes proc { 0%,100%{opacity:.2} 50%{opacity:1} }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e1e38; border-radius: 99px; }
