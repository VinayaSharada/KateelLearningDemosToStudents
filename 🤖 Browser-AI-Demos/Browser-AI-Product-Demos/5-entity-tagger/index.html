<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Named Entity Tagger | Browser AI Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #080810;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── status bar ── */
    #status-bar {
      background: #0c0c1c;
      border-bottom: 1px solid #18183a;
      padding: 7px 20px;
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; flex-shrink: 0;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #505090; flex-shrink: 0; transition: background .4s, box-shadow .4s; }
    .dot.loading { background: #f59e0b; animation: pulse 1.2s ease-in-out infinite; }
    .dot.ready   { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .dot.error   { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #status-label { color: #8080b0; flex: 1; }
    #prog-wrap { width: 140px; height: 3px; background: #18183a; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
    #prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #06b6d4, #6366f1); border-radius: 99px; transition: width .25s; }
    #prog-pct  { color: #06b6d4; font-size: 11.5px; min-width: 34px; text-align: right; }
    .back-link { color: #30305a; text-decoration: none; font-size: 12px; flex-shrink: 0; }
    .back-link:hover { color: #7070a0; }

    /* ── header ── */
    #header { background: #0a0a18; border-bottom: 1px solid #14142c; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #header h1 { font-size: 15px; font-weight: 700; }
    .badge { font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.3); color: #67e8f9; }

    /* ── layout ── */
    #workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 800px) { #workspace { grid-template-columns: 1fr; } }

    /* ── pane shared ── */
    .pane { display: flex; flex-direction: column; }
    .pane-header {
      padding: 10px 18px;
      border-bottom: 1px solid #14142c;
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #404070;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* ── input pane ── */
    #input-pane { border-right: 1px solid #14142c; }

    #text-input {
      flex: 1; min-height: 300px;
      background: #0a0a18; border: none; outline: none;
      color: #d8d8f4; font-size: 14.5px; font-family: inherit;
      line-height: 1.75; padding: 20px 22px; resize: none;
    }
    #text-input::placeholder { color: #202040; font-style: italic; }
    #text-input:disabled { opacity: .45; cursor: not-allowed; }

    .sample-row {
      padding: 10px 16px;
      border-top: 1px solid #14142c;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .sample-lbl { font-size: 11px; color: #30305a; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
    .sample-btn {
      font-size: 11.5px; padding: 4px 11px; border-radius: 8px;
      border: 1px solid #22223a; background: #0e0e20; color: #60609a;
      cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s;
    }
    .sample-btn:hover { border-color: #06b6d4; color: #67e8f9; }

    .debounce-bar {
      height: 2px; background: #14142c; overflow: hidden;
    }
    .debounce-fill {
      height: 100%; width: 0%; background: #06b6d4;
      transition: width .4s linear;
    }

    /* ── output pane ── */
    #output-pane { }

    /* Entity legend */
    #legend {
      padding: 10px 18px;
      border-bottom: 1px solid #14142c;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .legend-chip {
      display: flex; align-items: center; gap: 5px;
      font-size: 11.5px; color: #60608a;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* highlighted output */
    #highlight-output {
      flex: 1; padding: 20px 22px;
      font-size: 14.5px; line-height: 1.85;
      color: #c0c0e8; overflow-y: auto;
      min-height: 220px;
    }
    .entity-span {
      display: inline;
      padding: 1px 5px 2px;
      border-radius: 5px;
      font-weight: 600;
      cursor: default;
      position: relative;
    }
    .entity-label {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      vertical-align: super; margin-left: 2px; opacity: .8;
    }

    /* entity type colors */
    .ent-PER  { background: rgba(168,85,247,.18); color: #d8b4fe; border: 1px solid rgba(168,85,247,.35); }
    .ent-ORG  { background: rgba(59,130,246,.18);  color: #93c5fd; border: 1px solid rgba(59,130,246,.35); }
    .ent-LOC  { background: rgba(16,185,129,.18);  color: #6ee7b7; border: 1px solid rgba(16,185,129,.35); }
    .ent-MISC { background: rgba(245,158,11,.18);  color: #fcd34d; border: 1px solid rgba(245,158,11,.35); }
    .ent-DATE { background: rgba(236,72,153,.18);  color: #f9a8d4; border: 1px solid rgba(236,72,153,.35); }
    .ent-MON  { background: rgba(6,182,212,.18);   color: #67e8f9; border: 1px solid rgba(6,182,212,.35); }
    .ent-NUM  { background: rgba(132,204,22,.18);  color: #bef264; border: 1px solid rgba(132,204,22,.35); }

    /* idle state */
    #idle-msg { color: #202040; font-size: 13px; font-style: italic; }

    /* ── stats panel ── */
    #stats-panel {
      border-top: 1px solid #14142c;
      padding: 14px 18px;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 6px;
      background: #0e0e20; border: 1px solid #1e1e38;
      border-radius: 8px; padding: 5px 12px;
      font-size: 12px;
    }
    .stat-chip .sc-dot { width: 7px; height: 7px; border-radius: 50%; }
    .stat-chip .sc-count { font-weight: 700; color: #e2e2f0; }
    .stat-chip .sc-lbl  { color: #50508a; }

    /* processing spinner */
    #proc-spin {
      display: none; align-items: center; gap: 8px;
      font-size: 12px; color: #50508a; padding: 4px 0;
    }
    #proc-spin.visible { display: flex; }
    .spin-xs { width: 14px; height: 14px; border: 2px solid #1e1e38; border-top-color: #06b6d4; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* loading overlay */
    #load-overlay { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; flex:1; color:#404070; text-align:center; padding:40px; }
    #load-overlay.hidden { display:none; }
    .spinner { width:36px;height:36px;border:3px solid #1a1a38;border-top-color:#06b6d4;border-radius:50%;animation:spin .8s linear infinite; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#1e1e38;border-radius:99px; }
  </style>
