<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantic Search | Browser AI Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #07070e;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── status bar ── */
    #status-bar {
      background: #0b0b18;
      border-bottom: 1px solid #161630;
      padding: 7px 20px;
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; flex-shrink: 0;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #505090; flex-shrink: 0; transition: background .4s, box-shadow .4s; }
    .dot.loading { background: #f59e0b; animation: pulse 1.2s ease-in-out infinite; }
    .dot.ready   { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
    .dot.error   { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #status-label { color: #8080b0; flex: 1; }
    #prog-wrap { width: 140px; height: 3px; background: #161630; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
    #prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f97316, #eab308); border-radius: 99px; transition: width .25s; }
    #prog-pct  { color: #f97316; font-size: 11.5px; min-width: 34px; text-align: right; }
    .back-link { color: #30305a; text-decoration: none; font-size: 12px; flex-shrink: 0; }
    .back-link:hover { color: #7070a0; }

    /* ── header ── */
    #header { background: #090915; border-bottom: 1px solid #131325; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #header h1 { font-size: 15px; font-weight: 700; }
    .badge { font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
    .badge-orange { background: rgba(249,115,22,.12); border: 1px solid rgba(249,115,22,.3); color: #fdba74; }
    .badge-info   { background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.3); color: #a5b4fc; }

    /* ── explainer banner ── */
    #explainer {
      background: rgba(99,102,241,.06);
      border-bottom: 1px solid rgba(99,102,241,.15);
      padding: 10px 24px;
      font-size: 12.5px;
      color: #6060a0;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #explainer strong { color: #8888c8; }

    /* ── main ── */
    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 0;
      overflow: hidden;
    }
    @media (max-width: 860px) { #main { grid-template-columns: 1fr; } }

    /* ── corpus panel ── */
    #corpus-panel {
      border-right: 1px solid #131325;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid #131325;
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: #404070;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #doc-count { color: #f97316; }

    #doc-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    .doc-card {
      background: #0e0e1e;
      border: 1px solid #1a1a32;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #8080b0;
      cursor: default;
      transition: border-color .2s;
      position: relative;
    }
    .doc-card.matched { border-color: #f97316; color: #d8d8f0; background: rgba(249,115,22,.05); }
    .doc-card .doc-title { font-weight: 700; font-size: 11.5px; color: #5050a0; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .05em; }
    .doc-card.matched .doc-title { color: #f97316; }
    .del-doc {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; color: #30305a; font-size: 12px;
      cursor: pointer; padding: 0 3px; line-height: 1; border-radius: 4px;
      transition: color .15s;
    }
    .del-doc:hover { color: #ef4444; }

    /* add document form */
    #add-doc-form {
      border-top: 1px solid #131325;
      padding: 10px;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    #new-doc-title {
      background: #0e0e1e; border: 1px solid #1a1a32; border-radius: 8px;
      padding: 6px 10px; color: #e2e2f0; font-size: 12.5px; font-family: inherit; outline: none;
    }
    #new-doc-title::placeholder { color: #303055; }
    #new-doc-text {
      background: #0e0e1e; border: 1px solid #1a1a32; border-radius: 8px;
      padding: 6px 10px; color: #e2e2f0; font-size: 12.5px; font-family: inherit;
      resize: none; outline: none; min-height: 56px;
    }
    #new-doc-text::placeholder { color: #303055; }
    #new-doc-title:focus, #new-doc-text:focus { border-color: #f97316; }
    #add-btn {
      background: #f97316; border: none; border-radius: 8px; color: #fff;
      font-size: 12.5px; font-weight: 700; font-family: inherit;
      padding: 7px; cursor: pointer; transition: background .15s;
    }
    #add-btn:hover { background: #ea6c0a; }
    #add-btn:disabled { background: #1e1e38; color: #40406a; cursor: not-allowed; }

    /* ── search panel ── */
    #search-panel { display: flex; flex-direction: column; overflow: hidden; }

    /* search bar */
    #search-bar-wrap {
      padding: 14px 20px;
      border-bottom: 1px solid #131325;
      flex-shrink: 0;
    }
    #search-row {
      display: flex; gap: 8px; align-items: center;
      background: #0e0e1e; border: 1px solid #1e1e38;
      border-radius: 12px; padding: 8px 12px;
      transition: border-color .2s;
    }
    #search-row:focus-within { border-color: #f97316; }
    #search-input {
      flex: 1; background: none; border: none; outline: none;
      color: #e2e2f0; font-size: 15px; font-family: inherit;
    }
    #search-input::placeholder { color: #303055; }
    #search-input:disabled { cursor: not-allowed; }
    #search-btn {
      background: #f97316; border: none; border-radius: 8px; color: #fff;
      width: 32px; height: 32px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: background .15s;
    }
    #search-btn:hover:not(:disabled) { background: #ea6c0a; }
    #search-btn:disabled { background: #1e1e38; cursor: not-allowed; }

    /* keyword toggle */
    #toggle-row {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      font-size: 12px; color: #50508a;
    }
    .toggle-switch { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    #kw-toggle { display: none; }
    .toggle-track {
      width: 32px; height: 18px; background: #1e1e38; border-radius: 99px;
      position: relative; transition: background .2s;
    }
    #kw-toggle:checked + .toggle-track { background: #f97316; }
    .toggle-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; background: #fff; border-radius: 50%;
      transition: left .2s;
    }
    #kw-toggle:checked + .toggle-track .toggle-thumb { left: 16px; }

    /* results */
    #results-scroll { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

    /* empty / loading states */
    #empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; text-align: center; color: #20203a; gap: 10px; padding: 40px;
    }
    #empty-state .icon { font-size: 40px; }
    #empty-state h3 { font-size: 15px; color: #30306a; }
    #empty-state p { font-size: 12.5px; max-width: 340px; line-height: 1.6; }

    #model-loading-overlay {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; gap: 14px; color: #404070; text-align: center; padding: 40px;
    }
    #model-loading-overlay.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid #1a1a38; border-top-color: #f97316; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* result card */
    .result-card {
      background: #0e0e1e;
      border: 1px solid #1a1a32;
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp .2s ease;
      transition: border-color .2s;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1} }
    .result-card:first-child { border-color: #f97316; box-shadow: 0 0 20px rgba(249,115,22,.1); }

    .rc-header {
      padding: 8px 14px;
      background: #0c0c1c;
      border-bottom: 1px solid #1a1a32;
      display: flex; align-items: center; justify-content: space-between;
    }
    .rc-rank {
      font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    }
    .result-card:first-child .rc-rank { color: #f97316; }
    .rc-rank-rest { color: #404070; }

    .score-display { display: flex; align-items: center; gap: 8px; }
    .score-pct { font-size: 13px; font-weight: 700; }
    .result-card:first-child .score-pct { color: #f97316; }
    .score-bar-wrap { width: 80px; height: 4px; background: #1a1a32; border-radius: 99px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 99px; background: #404070; transition: width .4s; }
    .result-card:first-child .score-bar { background: linear-gradient(90deg, #f97316, #eab308); }

    .rc-title { padding: 10px 14px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #50508a; }
    .rc-text  { padding: 4px 14px 14px; font-size: 13.5px; line-height: 1.65; color: #b0b0d0; }

    /* keyword match highlight inside result */
    .kw-match { background: rgba(249,115,22,.2); border-radius: 3px; padding: 0 2px; color: #fdba74; font-weight: 600; }

    /* comparison badge */
    .vs-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
      font-weight: 700; margin-left: 6px;
    }
    .vs-better { background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3); color: #86efac; }
    .vs-same   { background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.2); color: #94a3b8; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1a32; border-radius: 99px; }
  </style>
