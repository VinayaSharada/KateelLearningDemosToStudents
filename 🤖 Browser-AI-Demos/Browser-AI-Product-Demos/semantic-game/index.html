<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYNAPSE — Semantic Word Game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07070e;
      --panel:    #0d0d1c;
      --border:   #1a1a32;
      --accent:   #a855f7;
      --text:     #e2e2f0;
      --muted:    #60608a;
      --mono:     'Fira Code', 'Cascadia Code', 'JetBrains Mono', ui-monospace, monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ════════════════════════════════════════
       DIAGNOSTIC PANEL
       ════════════════════════════════════════ */
    #diag-panel {
      background: #040410;
      border-bottom: 1px solid #0c0c22;
      flex-shrink: 0;
    }

    #diag-title {
      padding: 5px 16px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #28284a;
      border-bottom: 1px solid #0c0c22;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    #diag-title .led {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      flex-shrink: 0;
    }
    #diag-title .led.loading { animation: led-pulse 1.1s ease-in-out infinite; }
    #diag-title .led.ready   { background: #22c55e; box-shadow: 0 0 8px #22c55e88; animation: none; }

    #diag-log {
      padding: 6px 16px 8px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.75;
      max-height: 168px;
      overflow-y: auto;
    }

    .dline {
      display: flex;
      gap: 0;
      animation: d-in .1s ease;
      white-space: nowrap;
    }

    /* column widths — everything fixed-width for tabular alignment */
    .d-ts   { color: #252545; width: 96px; flex-shrink: 0; }
    .d-lvl  { width: 52px; flex-shrink: 0; font-weight: 700; }
    .d-msg  { color: #7070a8; flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .d-msg em { color: #b0b0d0; font-style: normal; }
    .d-bar  { color: var(--accent); width: 148px; flex-shrink: 0; letter-spacing: -.05em; }
    .d-pct  { color: #c8c8e8; width: 60px; flex-shrink: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .d-size { color: #404068; width: 120px; flex-shrink: 0; text-align: right; }
    .d-spd  { color: #303058; width: 90px; flex-shrink: 0; text-align: right; }

    .lvl-init { color: #6366f1; }
    .lvl-dl   { color: #f59e0b; }
    .lvl-ok   { color: #22c55e; }
    .lvl-warn { color: #ef4444; }
    .lvl-info { color: #06b6d4; }

    /* ════════════════════════════════════════
       GAME AREA
       ════════════════════════════════════════ */
    #game {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 64px;
    }

    #game-inner {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Title ── */
    #hero { text-align: center; }

    #hero-title {
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 900;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #e2e2f0 20%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
    }

    #hero-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    #meta-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-chip {
      font-size: 11.5px;
      padding: 3px 11px;
      border-radius: 99px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #50508a;
    }
    .meta-chip.live { color: #7060a8; }

    /* ── Engine loading placeholder ── */
    #loading-state {
      background: rgba(168,85,247,.05);
      border: 1px solid rgba(168,85,247,.18);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #6050a0;
    }
    .spin { width: 18px; height: 18px; border: 2px solid rgba(168,85,247,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; flex-shrink: 0; }

    /* ── Input row ── */
    #input-wrap { display: none; flex-direction: column; gap: 6px; }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #guess-in {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px 18px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      letter-spacing: .01em;
    }
    #guess-in:focus { border-color: var(--accent); }
    #guess-in::placeholder { color: #252545; }
    #guess-in:disabled { opacity: .35; cursor: not-allowed; }

    #guess-btn {
      background: var(--accent);
      border: none;
      border-radius: 13px;
      padding: 13px 22px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .07em;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s, transform .1s;
    }
    #guess-btn:hover:not(:disabled) { background: #9333ea; }
    #guess-btn:active:not(:disabled) { transform: scale(.96); }
    #guess-btn:disabled { background: #201030; color: #402060; cursor: not-allowed; }

    #err-msg { font-size: 12px; color: #ef4444; min-height: 14px; padding-left: 4px; }

    /* ── Score Gauge ── */
    #gauge-wrap {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px 18px;
      position: relative;
      overflow: hidden;
    }
    #gauge-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gauge-glow, transparent);
      pointer-events: none;
      transition: background .6s;
    }

    #gauge-lbl {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #404068;
      margin-bottom: 12px;
    }

    #gauge-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    #gauge-word {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
      line-height: 1;
    }

    #gauge-right { text-align: right; }

    #gauge-num {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      transition: color .4s;
    }

    #gauge-temp {
      font-size: 12.5px;
      margin-top: 2px;
      transition: color .4s;
    }

    #gauge-track {
      height: 8px;
      background: #09091a;
      border-radius: 99px;
      overflow: hidden;
    }

    #gauge-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width .7s cubic-bezier(.22, 1, .36, 1), background-color .4s;
    }

    /* ── History ── */
    #history-wrap { display: none; }

    #hist-hdr {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #404068;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #hist-best { font-size: 11.5px; }

    #hist-list { display: flex; flex-direction: column; gap: 5px; }

    .hrow {
      display: grid;
      grid-template-columns: 24px minmax(0,1fr) 100px 52px;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      animation: row-in .18s ease;
    }
    .hrow.best { border-color: rgba(168,85,247,.3); background: rgba(168,85,247,.04); }

    .h-rank { font-size: 10.5px; color: #303055; font-variant-numeric: tabular-nums; }
    .h-word-col { min-width: 0; }
    .h-word { font-size: 13.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .h-mini-track { height: 3px; background: #09091a; border-radius: 99px; overflow: hidden; margin-top: 3px; }
    .h-mini-fill  { height: 100%; border-radius: 99px; }
    .h-temp { font-size: 11.5px; color: #505080; }
    .h-pct  { font-size: 14px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }

    /* ── Win overlay ── */
    #win-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(7,7,14,.88);
      backdrop-filter: blur(10px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #win-overlay.show { display: flex; }

    #win-card {
      background: #0f0f1e;
      border: 1px solid rgba(168,85,247,.35);
      border-radius: 22px;
      padding: 44px 36px 36px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 80px rgba(168,85,247,.12);
      animation: pop-in .32s cubic-bezier(.22,1,.36,1);
    }

    #win-emoji  { font-size: 54px; margin-bottom: 14px; line-height: 1; }
    #win-title  { font-size: 26px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
    #win-label  { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    #win-word {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }

    #win-stat { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    .w-btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: none;
      margin: 4px;
      transition: opacity .15s;
    }
    .w-btn:hover { opacity: .85; }
    #copy-btn   { background: var(--accent); color: #fff; }
    #dismiss-btn{ background: var(--panel); color: var(--text); border: 1px solid var(--border); }

    /* ── Animations ── */
    @keyframes led-pulse  { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes spin       { to{transform:rotate(360deg)} }
    @keyframes d-in       { from{opacity:0} to{opacity:1} }
    @keyframes row-in     { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
    @keyframes pop-in     { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:none} }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e1e38; border-radius: 99px; }
  </style>
