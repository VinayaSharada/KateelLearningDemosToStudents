<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opinion Quintuple Extractor | Browser AI Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #07070f; color: #e2e2f0;
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── status bar ── */
    #status-bar {
      background: #0b0b1a; border-bottom: 1px solid #161630;
      padding: 7px 20px; display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; flex-shrink: 0;
    }
    .dot { width:9px;height:9px;border-radius:50%;background:#505090;flex-shrink:0;transition:background .4s,box-shadow .4s; }
    .dot.loading { background:#f59e0b;animation:pulse 1.2s ease-in-out infinite; }
    .dot.ready   { background:#22c55e;box-shadow:0 0 8px #22c55e88; }
    .dot.error   { background:#ef4444; }
    .dot.working { background:#818cf8;animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    #status-label { color:#8080b0;flex:1; }
    #prog-wrap { width:140px;height:3px;background:#161630;border-radius:99px;overflow:hidden;flex-shrink:0; }
    #prog-fill { height:100%;width:0%;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:99px;transition:width .25s; }
    #prog-pct  { color:#a855f7;font-size:11.5px;min-width:34px;text-align:right; }
    .back-link { color:#30305a;text-decoration:none;font-size:12px;flex-shrink:0; }
    .back-link:hover { color:#7070a0; }

    /* ── header ── */
    #header {
      background:#090916;border-bottom:1px solid #131328;
      padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;
    }
    #header h1 { font-size:15px;font-weight:700; }
    .badge { font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px; }
    .b-purple { background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.35);color:#c084fc; }
    .b-pink   { background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.3);color:#f9a8d4; }
    .b-teal   { background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.3);color:#5eead4; }
    #model-badge { font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;
                   background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;
                   transition:all .3s; }

    /* ── model selector bar ── */
    #model-bar {
      background:#08081a;border-bottom:1px solid #10102a;
      padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;
    }
    #model-bar label { font-size:11.5px;color:#50508a;font-weight:600;white-space:nowrap; }
    #model-select {
      flex:1;min-width:220px;max-width:400px;
      background:#0e0e20;border:1px solid #1e1e38;color:#c0c0e0;
      font-size:12px;padding:5px 8px;border-radius:7px;outline:none;cursor:pointer;
    }
    #model-select:focus { border-color:#6060a0; }
    #model-select option { background:#0e0e20; }
    #load-btn {
      font-size:12px;padding:5px 14px;border-radius:7px;cursor:pointer;
      background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;color:#fff;
      font-weight:600;transition:opacity .15s;white-space:nowrap;
    }
    #load-btn:hover:not(:disabled) { opacity:.85; }
    #load-btn:disabled { background:#1e1e38;color:#40405a;cursor:not-allowed; }
    #model-meta {
      font-size:11px;color:#35355a;white-space:nowrap;
      display:flex;align-items:center;gap:6px;
    }
    #model-meta .ms-size { color:#5050a0; }
    #model-meta .ms-note { color:#3a3a60; }
    .rec-star { color:#f59e0b;font-size:12px; }

    /* ── main split ── */
    #main { flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:hidden; }
    @media (max-width:860px) { #main { grid-template-columns:1fr;overflow:visible; } }

    .panel { display:flex;flex-direction:column;min-height:0;overflow:hidden; }
    #left-panel { border-right:1px solid #131328; }

    .panel-header {
      padding:10px 16px;border-bottom:1px solid #0f0f22;
      font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#40407a;
      display:flex;align-items:center;gap:8px;flex-shrink:0;
    }
    .panel-sub { color:#6060a0;font-weight:400;font-size:12px;text-transform:none;letter-spacing:0; }

    .tabs { display:flex;gap:2px;margin-left:auto; }
    .tab-btn { font-size:11px;padding:3px 10px;border-radius:6px;border:none;
               background:rgba(255,255,255,.04);color:#50508a;cursor:pointer;transition:all .15s; }
    .tab-btn.active { background:rgba(168,85,247,.18);color:#c084fc; }
    .tab-btn:disabled { opacity:.35;cursor:not-allowed; }

    /* presets */
    #presets { padding:8px 14px;display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid #0f0f22; }
    .preset-btn { font-size:11px;padding:3px 10px;border-radius:99px;
                  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
                  color:#8080b0;cursor:pointer;transition:all .15s; }
    .preset-btn:hover  { background:rgba(168,85,247,.14);border-color:#a855f7;color:#c084fc; }
    .preset-btn.active { background:rgba(168,85,247,.2);border-color:#a855f7;color:#e2d9f3; }

    /* coref toggle */
    #coref-toggle-row { padding:8px 14px;border-bottom:1px solid #0f0f22;
                        display:flex;align-items:center;gap:8px;flex-shrink:0; }
    #coref-cb { accent-color:#a855f7;width:14px;height:14px;cursor:pointer; }
    #coref-label { font-size:12px;color:#7070b0;cursor:pointer;user-select:none;
                   display:flex;align-items:center;gap:6px;flex:1; }
    #coref-label strong { color:#a0a0d0; }
    .coref-why { font-size:10.5px;color:#30304a;margin-left:auto;
                 background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.15);
                 border-radius:99px;padding:2px 8px;cursor:help; }

    /* pipeline pills */
    #pipeline-strip { padding:8px 14px;border-bottom:1px solid #0f0f22;
                      display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap; }
    .stage-pill { font-size:11px;padding:3px 10px;border-radius:99px;
                  border:1px solid #1a1a30;color:#40405a;background:rgba(255,255,255,.03);
                  display:flex;align-items:center;gap:5px;transition:all .3s; }
    .stage-pill .sd { width:7px;height:7px;border-radius:50%;background:#303050; }
    .stage-pill.active .sd { background:#f59e0b;animation:pulse 1s ease-in-out infinite; }
    .stage-pill.done   { border-color:rgba(34,197,94,.3);color:#86efac; }
    .stage-pill.done .sd { background:#22c55e;animation:none; }
    .stage-pill.skip   { opacity:.3; }
    .sarrow { color:#252545;font-size:12px; }

    /* coref result */
    #coref-result-wrap { display:none;flex-shrink:0;border-bottom:1px solid #0f0f22; }
    #coref-result-header { padding:6px 14px;display:flex;align-items:center;gap:8px;
                           font-size:11px;color:#50509a;cursor:pointer;user-select:none; }
    #coref-result-header:hover { color:#8080c0; }
    #coref-chevron { transition:transform .2s;margin-left:auto; }
    #coref-resolved-text { max-height:120px;overflow-y:auto;margin:0 14px 10px;
                           background:#0a0a1c;border:1px solid #1a1a34;border-radius:8px;
                           padding:10px 12px;font-size:12.5px;line-height:1.75;color:#9090c8;
                           white-space:pre-wrap;word-break:break-word; }
    .coref-resolved { color:#5eead4;text-decoration:underline;text-decoration-style:dotted;cursor:help; }

    /* tab content */
    .tab-content { flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column; }
    #review-input { flex:1;padding:14px 16px;background:transparent;border:none;resize:none;
                    color:#d0d0f0;font-size:13.5px;line-height:1.8;outline:none;font-family:inherit;min-height:140px; }
    #review-input::placeholder { color:#2a2a4a; }
    #hl-view { flex:1;padding:14px 16px;font-size:13.5px;line-height:1.9;
               color:#c8c8e8;overflow-y:auto;white-space:pre-wrap;word-break:break-word; }

    mark { border-radius:3px;padding:1px 0;cursor:default; }
    mark.hl-quote-pos { background:rgba(34,197,94,.09);color:inherit; }
    mark.hl-quote-neg { background:rgba(239,68,68,.09);color:inherit; }
    mark.hl-quote-neu { background:rgba(148,163,184,.07);color:inherit; }
    mark.hl-object    { background:rgba(99,102,241,.22);color:#c7d2fe; }
    mark.hl-feature   { background:rgba(245,158,11,.28);color:#fde68a;font-weight:700; }
    mark.hl-holder    { background:rgba(168,85,247,.22);color:#e9d5ff; }
    mark.hl-time      { background:rgba(6,182,212,.18);color:#a5f3fc;font-style:italic; }
    mark[title]:hover { outline:1px solid rgba(255,255,255,.22); }

    /* legend */
    #legend { padding:7px 14px;border-top:1px solid #0f0f22;
              display:flex;gap:9px;flex-wrap:wrap;flex-shrink:0; }
    .leg { display:flex;align-items:center;gap:5px;font-size:11px;color:#40405a; }
    .leg mark { font-size:10.5px;padding:1px 6px;font-weight:600;cursor:default; }

    #qinfo { margin:0 14px 8px;background:#0d0d22;border:1px solid #1a1a38;
             border-radius:8px;padding:8px 12px;font-size:11.5px;color:#44448a;line-height:1.6;flex-shrink:0; }
    #qinfo strong { color:#6060a8; }
    #qinfo code { background:rgba(168,85,247,.12);padding:1px 5px;border-radius:4px;font-size:10px;color:#c084fc; }

    #extract-btn { margin:0 14px 12px;padding:10px 0;
                   background:linear-gradient(135deg,#7c3aed,#a855f7);
                   border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;
                   cursor:pointer;transition:opacity .15s,transform .1s;flex-shrink:0; }
    #extract-btn:hover:not(:disabled) { opacity:.88; }
    #extract-btn:active:not(:disabled) { transform:scale(.98); }
    #extract-btn:disabled { background:#1e1e38;color:#40405a;cursor:not-allowed; }

    /* right panel */
    #results-area { flex:1;overflow-y:auto;padding:14px; }
    #empty-state { display:flex;flex-direction:column;align-items:center;justify-content:center;
                   min-height:260px;gap:12px;text-align:center; }
    #empty-state .icon { font-size:44px;opacity:.25; }
    #empty-state p { color:#30305a;font-size:13px;max-width:260px;line-height:1.6; }
    #spinner { display:none;flex-direction:column;align-items:center;justify-content:center;min-height:260px;gap:14px; }
    .spin-ring { width:38px;height:38px;border:3px solid #1a1a32;border-top-color:#a855f7;
                 border-radius:50%;animation:spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    #spinner p { color:#50508a;font-size:13px; }
    #raw-stream { display:none;background:#0a0a18;border:1px solid #1a1a30;border-radius:8px;
                  padding:10px 12px;margin-bottom:10px;font-family:'Fira Code',monospace;
                  font-size:11px;color:#5050a0;line-height:1.55;white-space:pre-wrap;
                  word-break:break-word;max-height:110px;overflow-y:auto; }

    .qcard { background:#0e0e1e;border:1px solid #1c1c32;border-radius:12px;
             padding:12px 14px;margin-bottom:10px;
             display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;
             animation:fadeIn .3s ease;cursor:pointer;transition:border-color .2s; }
    .qcard:hover { border-color:#2a2a48; }
    .qcard.hl-active { border-color:#a855f7;box-shadow:0 0 0 1px rgba(168,85,247,.25); }
    @keyframes fadeIn { from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none} }
    .qcard-header { grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-bottom:2px; }
    .qcard-num { width:22px;height:22px;border-radius:50%;flex-shrink:0;
                 background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.4);
                 color:#c084fc;font-size:11px;font-weight:700;
                 display:flex;align-items:center;justify-content:center; }
    .qcard-title { font-size:12.5px;font-weight:600;color:#c0c0e0;flex:1;
                   white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .sbadge { font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px; }
    .sbadge.pos { background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);color:#86efac; }
    .sbadge.neg { background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5; }
    .sbadge.neu { background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.25);color:#94a3b8; }
    .coref-badge { font-size:10px;padding:1px 7px;border-radius:99px;margin-left:2px;
                   background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.3);color:#5eead4; }
    .qfield { display:flex;flex-direction:column;gap:3px; }
    .qlabel { font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#30305a; }
    .qval { font-size:12px;color:#b0b0d8;background:rgba(255,255,255,.03);
            border:1px solid rgba(255,255,255,.06);border-radius:5px;padding:3px 7px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .qval.v-object  { border-color:rgba(99,102,241,.25);color:#c7d2fe; }
    .qval.v-feature { border-color:rgba(245,158,11,.3);color:#fde68a;font-weight:600; }
    .qval.v-holder  { border-color:rgba(168,85,247,.25);color:#e9d5ff; }
    .qval.v-time    { border-color:rgba(6,182,212,.22);color:#a5f3fc;font-style:italic; }

    #results-footer { display:none;padding:8px 14px;border-top:1px solid #0f0f22;
                      flex-shrink:0;align-items:center;gap:8px; }
    #count-badge { font-size:12px;color:#6060a0; }
    #count-badge strong { color:#a855f7; }
    #copy-btn,#toggle-raw-btn { font-size:11.5px;padding:4px 12px;border-radius:7px;cursor:pointer;transition:all .15s; }
    #copy-btn       { margin-left:auto;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.3);color:#c084fc; }
    #copy-btn:hover { background:rgba(168,85,247,.22); }
    #toggle-raw-btn { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#5050a0; }
    #toggle-raw-btn:hover { color:#8080c0; }
    .parse-error { background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);
                   border-radius:8px;padding:12px 14px;margin-bottom:10px;
                   font-size:12.5px;color:#fca5a5;line-height:1.6; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#1e1e38;border-radius:99px; }
  </style>
</head>
